<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Alexandria password</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 12px 32px;text-align:center;background:linear-gradient(180deg,#eff6ff 0%,#ffffff 100%);">
                <img
                  src="https://www.alexandriastudy.com/alexandria_logo.png"
                  alt="Alexandria"
                  width="72"
                  height="72"
                  style="display:block;margin:0 auto 12px auto;border:0;"
                />
                <div style="font-size:22px;font-weight:700;letter-spacing:0.02em;color:#1d4ed8;">Alexandria</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;">
                <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:700;">Reset your password</h1>
                <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#334155;">
                  We received a request to reset the password for your Alexandria account.
                  Click below to choose a new one.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 32px 24px 32px;">
                <a
                  href="{{ .SiteURL }}/confirm-email#{{ .ConfirmationURL }}"
                  style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:14px 28px;border-radius:10px;"
                >
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px 32px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">
                  If you didn’t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 24px 32px;border-top:1px solid #e2e8f0;text-align:center;">
                <p style="margin:0;font-size:12px;color:#94a3b8;">
                  Sent by Alexandria · alexandriastudy.com
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
